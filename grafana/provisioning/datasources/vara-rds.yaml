apiVersion: 1
datasources:
  - name: VARA-RDS
    uid: vara-rds            # 대시보드 패널이 이 uid 로 참조
    type: postgres
    access: proxy
    url: ${RDS_HOST}:${RDS_PORT}
    database: ${RDS_DB}
    user: ${RDS_USER}
    isDefault: true
    jsonData:
      sslmode: ${RDS_SSLMODE}
      postgresVersion: 1500
      timescaledb: false
    secureJsonData:
      password: ${RDS_PASSWORD}
    editable: false
