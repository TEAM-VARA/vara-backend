# Schema v1 (2026-05-16 마이그레이션).
#
# 이전 v0 한계 (정확성 부분 위배):
#   v0는 `(a) update/patch on certificatesigningrequests/approval`만 매치 →
#   실제 system:masters 인증서 발급에는 (a) + (b) 둘 다 필요한데 (b)는 안 봄.
#   over-broad (false positive) — yaml 주석에서 명시적으로 인정한 한계.
#
# v1 정확화:
#   match_all_of로 (a) AND (b) AND signer name 좁힘:
#     (a) certificatesigningrequests/approval 에 update OR patch
#     (b) signers 에 approve, resourceNames = ["kubernetes.io/kube-apiserver-client"]
#
#   `kubernetes.io/kube-apiserver-client` signer는 CN=anything, O=system:masters
#   인증서로 cluster-admin 가능. 다른 signer는 권한 상승 효과 약함. K8s 공식:
#     https://kubernetes.io/docs/reference/access-authn-authz/certificate-signing-requests/#kubernetes-signers
#
# verb 선택:
#   update — kubectl certificate approve가 사용. 정식 경로.
#   patch  — K8s API가 subresource에 PATCH 허용. 동등한 우회 경로.
#   create/delete는 approval 메커니즘과 무관 — 제외.
#
# subresource:
#   certificatesigningrequests/approval만 매치. certificatesigningrequests(본 리소스,
#   create는 CSR 제출만 가능, 승인 아님)는 (a)에 안 포함.
#
# fixpoint transition 매핑 (1:1):
#   transition_R_INDIRECT_07 → cluster-admin (*,*,*,*) 흡수.

schema_version: "1.0"
id: R-INDIRECT-07
description: "csr create+get AND csr/approval (update|patch) AND signers/kube-apiserver-client approve -> cluster-admin 인증서 발급"
category: indirect
severity: critical

match_all_of:
  # (1) CSR 제출 — O=system:masters CSR 생성 (top-level create라 resourceName 제한 불가)
  - api_group: "certificates.k8s.io"
    resource:  "certificatesigningrequests"
    verb:      "create"
  # (2) 발급 인증서 회수 — .status.certificate 읽기 (없으면 인증서 사용 불가; R-INDIRECT-17 create+get 패턴과 동일)
  - api_group: "certificates.k8s.io"
    resource:  "certificatesigningrequests"
    verb:      "get"
  # (3) 승인 — approval 서브리소스 update 또는 patch
  - match_any_of:
      - api_group: "certificates.k8s.io"
        resource:  "certificatesigningrequests/approval"
        verb:      "update"
      - api_group: "certificates.k8s.io"
        resource:  "certificatesigningrequests/approval"
        verb:      "patch"
  # (4) 서명자 승인 — kube-apiserver-client (CN=anything, O=system:masters → cluster-admin)
  - api_group: "certificates.k8s.io"
    resource:  "signers"
    verb:      "approve"
    resource_names: ["kubernetes.io/kube-apiserver-client"]

sources:
  - type: official
    name: "K8s - Certificate Signing Requests"
    url:  "https://kubernetes.io/docs/reference/access-authn-authz/certificate-signing-requests/"
  - type: official
    name: "K8s - RBAC Good Practices: CSRs and certificate issuing"
    url:  "https://kubernetes.io/docs/concepts/security/rbac-good-practices/#csrs-and-certificate-issuing"
  - type: tool
    name: "rbac-police - approve_csrs"
    url:  "https://github.com/PaloAltoNetworks/rbac-police/blob/main/lib/approve_csrs.rego"
