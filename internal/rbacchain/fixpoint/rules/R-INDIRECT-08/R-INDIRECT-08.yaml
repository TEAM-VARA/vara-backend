# Rule schema v0
# 매칭 단위: atomic permission triple (api_group, resource, verb)
# 의미: PolicyRule이 triple (g, r, v)를 grant한다 ==
#       (g in apiGroups OR "*" in apiGroups)
#   AND (r in resources  OR "*" in resources)
#   AND (v in verbs       OR "*" in verbs)
# resourceNames: 매칭에서는 무시. evidence에만 기록.
# nonResourceURLs: 무시.
# match_any_of: triple 중 하나라도 grant되면 매치 (OR).
#
# R-INDIRECT-08 단독 매칭 결정 (2026-05-10):
# 2 resources × 3 verbs = 6 triple OR. validating 또는 mutating webhook
# configuration 등록/수정 권한 단독으로 admission 가로채기 가능.
#
# 도달 모델 (정직한 메모):
#   "즉시 cluster-admin 도달"이 아니라 "점진적 침투 능력". 가짜 webhook 서버를 등록해
#   다음 사용자/시스템의 API 요청을 기다려야 함. 그러나 cluster-admin SA가 어디선가
#   API를 호출하는 순간 token/secret 가로채기 가능 — 구조적으로 admin 도달 경로.
#
# False positive 컨텍스트 (graph builder 책임):
#   cert-manager, sealed-secrets, OPA Gatekeeper, Kyverno 등 정상 도구가 webhook
#   configuration 권한을 보유. 매처는 권한만 보고, graph builder/reporter가 webhook
#   target URL 신뢰성 / 운영 컨텍스트로 위험도 가중.
#
# verb 결정 (create/update/patch):
#   create — 새 webhook configuration 등록.
#   update/patch — 기존 webhook의 target URL / rules 변경 (정상 webhook을 악성으로 변조).
#   delete는 webhook 제거 — DoS는 가능하나 가로채기 아님 (R-LATERAL 영역). 본 룰 제외.
#
# 신규 ValidatingAdmissionPolicy (R-INDIRECT-18, K8s 1.30+):
#   CEL 기반 admission 정책으로 별도 메커니즘. apiGroup 동일하지만 resource 이름이
#   다름 (validatingadmissionpolicies, validatingadmissionpolicybindings) → 본 룰과
#   책임 분리. 향후 MutatingAdmissionPolicy(1.32+)도 도입 예정.

schema_version: "0.1"
id: R-INDIRECT-08
description: "create/update/patch on validating/mutating webhook configurations -> admission 가로채기로 token 훔침 또는 강제 SA 마운트"
category: indirect
severity: critical

match_any_of:
  - { api_group: "admissionregistration.k8s.io", resource: "validatingwebhookconfigurations", verb: "create" }
  - { api_group: "admissionregistration.k8s.io", resource: "validatingwebhookconfigurations", verb: "update" }
  - { api_group: "admissionregistration.k8s.io", resource: "validatingwebhookconfigurations", verb: "patch" }
  - { api_group: "admissionregistration.k8s.io", resource: "mutatingwebhookconfigurations",   verb: "create" }
  - { api_group: "admissionregistration.k8s.io", resource: "mutatingwebhookconfigurations",   verb: "update" }
  - { api_group: "admissionregistration.k8s.io", resource: "mutatingwebhookconfigurations",   verb: "patch" }

# 5개 출처 매트릭스 매핑 (룰셋 검증 인덱스 2026-05-09 기준): K8s + RT + RP
sources:
  - type: official
    name: "K8s - Admission Webhooks (Dynamic Admission Control)"
    url:  "https://kubernetes.io/docs/reference/access-authn-authz/extensible-admission-controllers/"
  - type: official
    name: "K8s - RBAC Good Practices: Control admission webhooks"
    url:  "https://kubernetes.io/docs/concepts/security/rbac-good-practices/#control-admission-webhooks"
  - type: tool
    name: "rbac-tool (RT) - admission webhook 권한"
    url:  "https://github.com/alcideio/rbac-tool"
  - type: tool
    name: "rbac-police (RP) - manage_webhooks (archived 2025-04, 카탈로그 유효)"
    url:  "https://github.com/PaloAltoNetworks/rbac-police"
