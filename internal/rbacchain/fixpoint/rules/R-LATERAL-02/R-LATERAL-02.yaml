# Rule schema v0
# 매칭 단위: atomic permission triple (api_group, resource, verb)
# 의미: PolicyRule이 triple (g, r, v)를 grant한다 ==
#       (g in apiGroups OR "*" in apiGroups)
#   AND (r in resources  OR "*" in resources)
#   AND (v in verbs       OR "*" in verbs)
# resourceNames: 매칭에서는 무시. evidence에만 기록.
# nonResourceURLs: 무시.
# match_any_of: triple 중 하나라도 grant되면 매치 (OR).
#
# R-LATERAL-02 (구 R-INDIRECT-13): cluster-admin 도달이 아닌 가용성/방어 회피.
#
# 매칭 결정 (2026-05-10):
# 1 triple. nodes delete 단독으로 노드 삭제 가능 — 보안 모니터링 DaemonSet이 도는
# 노드를 제거하거나, 특정 워크로드를 강제로 다른 노드로 이동시켜 회피 효과.
#
# 도달 모델 — 권한 상승 아님:
#   1) attacker가 nodes delete 권한 보유
#   2) 보안 모니터링 DaemonSet이 도는 노드 삭제
#   3) 클라우드 컨트롤러가 노드 재생성하면 새 노드는 모니터링 DS 재배포 전까지 사각
#   4) attacker가 그 시점에 다른 룰의 chain 진척
#
# 5개 출처 매트릭스 매핑: 우리만. 본인 정의 룰. 다른 도구가 직접 룰로 안 다룸 (rbac-police의
# steal_pods 일부 유사하나 정확히 같은 메커니즘 아님).
#
# severity: warning (cluster-admin 도달 아님).

schema_version: "0.1"
id: R-LATERAL-02
description: "delete on nodes -> 보안 모니터링 노드 삭제, 회피 워크로드 운영"
category: lateral
severity: warning

match_any_of:
  - { api_group: "", resource: "nodes", verb: "delete" }

# 5개 출처 매트릭스 매핑 (룰셋 검증 인덱스 2026-05-09 기준): 우리만 (외부 매핑 없음)
sources:
  - type: official
    name: "K8s - Nodes (관리 동작 전반)"
    url:  "https://kubernetes.io/docs/concepts/architecture/nodes/"
  - type: writeup
    name: "VARA 5개 출처 매트릭스 분석 (2026-05-09): 외부 도구 명시 룰 없음"
    url:  "https://www.notion.so/3593978ee48d81a4ad8dd3d77aaa095c"
