# Rule schema v0
# 매칭 단위: atomic permission triple (api_group, resource, verb)
# 의미: PolicyRule이 triple (g, r, v)를 grant한다 ==
#       (g in apiGroups OR "*" in apiGroups)
#   AND (r in resources  OR "*" in resources)
#   AND (v in verbs       OR "*" in verbs)
# resourceNames: 매칭에서는 무시. evidence에만 기록.
# nonResourceURLs: 무시.
# match_any_of: triple 중 하나라도 grant되면 매치 (OR).
#
# R-DIRECT-02 단독 매칭 결정 (2026-05-09):
# bind 단독으로 매치한다. create on (cluster)rolebindings 조합 요구 안 함.
# 이유: bind와 create on rolebindings가 서로 다른 (Cluster)Role을 거쳐 한 subject에
# 모이는 경우를 놓치면 false negative. 실제 cluster-admin 도달 여부 판정은 매처
# 책임 외 - 그래프 빌더 단계에서 판단. R-DIRECT-01 (escalate)과 동일 논리.

schema_version: "1.0"
id: R-DIRECT-02
description: "(bind on roles/clusterroles) AND (create|update|patch on (cluster)rolebindings) -> 임의 (Cluster)Role 자가 바인딩"
category: direct
severity: critical

match_all_of:
  # (a) bind: 임의 (Cluster)Role을 자신/타인에게 부착 (권한상승 제한 우회)
  - match_any_of:
      - api_group: "rbac.authorization.k8s.io"
        resource:  "roles"
        verb:      "bind"
      - api_group: "rbac.authorization.k8s.io"
        resource:  "clusterroles"
        verb:      "bind"
  # (b) 바인딩 생성/수정: 실제로 바인딩 객체를 만들거나(create) 기존 바인딩 subject에 자신 추가(update/patch)
  - match_any_of:
      - api_group: "rbac.authorization.k8s.io"
        resource:  "rolebindings"
        verb:      "create"
      - api_group: "rbac.authorization.k8s.io"
        resource:  "rolebindings"
        verb:      "update"
      - api_group: "rbac.authorization.k8s.io"
        resource:  "rolebindings"
        verb:      "patch"
      - api_group: "rbac.authorization.k8s.io"
        resource:  "clusterrolebindings"
        verb:      "create"
      - api_group: "rbac.authorization.k8s.io"
        resource:  "clusterrolebindings"
        verb:      "update"
      - api_group: "rbac.authorization.k8s.io"
        resource:  "clusterrolebindings"
        verb:      "patch"

# 5개 출처 매트릭스 매핑 (룰셋 검증 인덱스 2026-05-09 기준): K8s + KS + RT + KR + RP
sources:
  - type: official
    name: "K8s - Privilege escalation prevention and bootstrapping"
    url:  "https://kubernetes.io/docs/reference/access-authn-authz/rbac/#privilege-escalation-prevention-and-bootstrapping"
  - type: tool
    name: "KubiScan (KS)"
    url:  "https://github.com/cyberark/KubiScan"
  - type: tool
    name: "rbac-tool (RT) - Modify Roles or Role Bindings 계열"
    url:  "https://github.com/alcideio/rbac-tool"
  - type: tool
    name: "krane (KR)"
    url:  "https://github.com/appvia/krane"
  - type: tool
    name: "rbac-police (RP) - bind_verb 계열 (archived 2025-04, 카탈로그로 유효)"
    url:  "https://github.com/PaloAltoNetworks/rbac-police"
