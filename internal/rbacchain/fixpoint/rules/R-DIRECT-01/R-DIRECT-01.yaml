# R-DIRECT-01: escalate verb on roles/clusterroles -> arbitrary self-grant.
# Schema v0. See SOURCES.md for 5-source matrix verification notes.

schema_version: "0.1"
id: R-DIRECT-01
description: "escalate verb on roles/clusterroles -> arbitrary self-grant"
category: direct
severity: critical

match_any_of:
  - api_group: "rbac.authorization.k8s.io"
    resource:  "roles"
    verb:      "escalate"
  - api_group: "rbac.authorization.k8s.io"
    resource:  "clusterroles"
    verb:      "escalate"

# 5-source mapping (verified against primary sources 2026-05-11):
#   K8s official: YES, rbac-tool: YES, rbac-police: YES,
#   KubiScan: NO direct escalate rule, krane: NO direct escalate rule.
