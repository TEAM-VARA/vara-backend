    name: "K8s RBAC - Privilege escalation prevention and bootstrapping"
    url:  "https://kubernetes.io/docs/reference/access-authn-authz/rbac/#privilege-escalation-prevention-and-bootstrapping"
  - type: official
    name: "K8s RBAC Good Practices - Escalate verb"
    url:  "https://kubernetes.io/docs/concepts/security/rbac-good-practices/#escalate-verb"
  - type: tool
    name: "rbac-tool - Identify Privileges Escalators via bind or escalate"
    url:  "https://github.com/alcideio/rbac-tool/blob/master/pkg/analysis/default-rules.yaml"
  - type: tool
    name: "rbac-police - escalate_roles.rego (archived 2025-04)"
