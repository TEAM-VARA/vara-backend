# Rule schema v0
# 매칭 단위: atomic permission triple (api_group, resource, verb)
# 의미: PolicyRule이 triple (g, r, v)를 grant한다 ==
#       (g in apiGroups OR "*" in apiGroups)
#   AND (r in resources  OR "*" in resources)
#   AND (v in verbs       OR "*" in verbs)
# resourceNames: 매칭에서는 무시. evidence에만 기록.
# nonResourceURLs: 무시.
# match_any_of: triple 중 하나라도 grant되면 매치 (OR).
#
# R-INDIRECT-06 단독 매칭 결정 (2026-05-10):
# 1 triple. K8s 1.24+ TokenRequest API의 정식 메커니즘 — POST
# /api/v1/namespaces/<ns>/serviceaccounts/<sa>/token == create on
# serviceaccounts/token. 단독 권한만 있어도 임의 SA(또는 resourceNames로 좁혀진
# SA들) 토큰을 즉석 발급 가능 → cluster-admin SA를 가리킬 경우 직접 도달.
#
# resourceNames 처리 (스키마 v0 한계):
#   운영자가 의도적으로 좁힐 수 있다 — `resourceNames: ["specific-sa"]`로 특정 SA에만
#   허용. K8s authorizer는 이 좁힘을 honor하지만 우리 매처는 매칭 시 무시하고 evidence에
#   리스트 그대로 남김. 결과적으로 좁힘이 있는 PolicyRule도 매치되며, graph builder가
#   "그 좁혀진 SA가 강한 SA인가"를 chain 분석에서 판단.
#   v1에서 resourceNames 매칭 도입 시 R-INDIRECT-16(aws-auth)과 함께 정확도 향상.
#
# subresource:
#   serviceaccounts/token이 정확한 매칭 대상. serviceaccounts(본 리소스)나
#   serviceaccounts/status 등은 권한 상승 벡터 아님.
#
# 미고려 정밀화 (그래프 빌더 / Phase 후반):
#   - 발급 토큰의 audience(`spec.audiences`)가 클러스터 API와 다른 경우 → 그 토큰으로
#     kubectl 호출 안 됨. 기본은 API audience. 매처 외 정보.
#   - expiration이 매우 짧으면 위험도 약간 감소하나 권한 상승 가능성은 있으므로 매치.

schema_version: "0.1"
id: R-INDIRECT-06
description: "create on serviceaccounts/token -> 임의 SA 토큰 즉석 발급 (TokenRequest API, K8s 1.24+ 정식 경로)"
category: indirect
severity: critical

match_any_of:
  - api_group: ""
    resource:  "serviceaccounts/token"
    verb:      "create"

# 5개 출처 매트릭스 매핑 (룰셋 검증 인덱스 2026-05-09 기준): K8s + RP
# (KS, RT, KR은 별도 룰로 다루지 않음 — 매트릭스 검증에서 확인된 누락)
sources:
  - type: official
    name: "K8s - TokenRequest API (Bound Service Account Tokens)"
    url:  "https://kubernetes.io/docs/reference/access-authn-authz/service-accounts-admin/#bound-service-account-tokens"
  - type: official
    name: "KEP-1205 - Bound Service Account Tokens"
    url:  "https://github.com/kubernetes/enhancements/tree/master/keps/sig-auth/1205-bound-service-account-tokens"
  - type: tool
    name: "rbac-police (RP) - request_token_for_sas (archived 2025-04, 카탈로그 유효)"
    url:  "https://github.com/PaloAltoNetworks/rbac-police"
