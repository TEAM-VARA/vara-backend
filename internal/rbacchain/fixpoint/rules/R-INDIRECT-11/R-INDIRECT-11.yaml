# Rule schema v0
# 매칭 단위: atomic permission triple (api_group, resource, verb)
# 의미: PolicyRule이 triple (g, r, v)를 grant한다 ==
#       (g in apiGroups OR "*" in apiGroups)
#   AND (r in resources  OR "*" in resources)
#   AND (v in verbs       OR "*" in verbs)
# resourceNames: 매칭에서는 무시. evidence에만 기록.
# nonResourceURLs: 무시.
# match_any_of: triple 중 하나라도 grant되면 매치 (OR).
#
# R-INDIRECT-11 단독 매칭 결정 (2026-05-10):
# 1 subresource × 2 verbs = 2 triple OR. nodes/proxy는 kubelet API 직접 프록시.
# get(GET) / create(POST) 중 하나만 있어도 kubelet exec/log 호출 가능 → 임의 Pod
# 토큰 추출.
#
# verb 결정 (get/create):
#   get — kubelet의 GET endpoint (예: /pods, /metrics).
#   create — kubelet의 POST endpoint (예: /exec, /run).
#   update/delete는 kubelet API에서 명확한 attack 경로 없음 — 본 룰 제외.
#   (Notion이 적은 ["*", get, create]에서 "*"는 wildcard 의미 강조용 — schema v0의
#    매처가 PolicyRule의 verbs:[*]를 자동으로 매치하므로 atomic AP에 별도 추가 불필요.)
#
# 다른 nodes 서브리소스 (별도 검토):
#   nodes/log, nodes/metrics, nodes/spec 등도 정보 노출 위험. 권한 상승 직접 경로
#   아니라 본 룰에서 제외. 향후 별도 룰 검토 가능.
#
# RBAC 우회 메커니즘:
#   kubelet API는 K8s API server의 RBAC를 안 거침. nodes/proxy 권한이 그 검사를
#   스킵하는 유일한 경로. 매우 강한 권한.
#
# kubelet authn/authz 환경 종속:
#   기본 EKS는 kubelet이 webhook 모드로 K8s API server와 인증 위임. 이 경우 nodes/proxy
#   호출자의 신원으로 kubelet 동작 — 우리 룰의 attack 경로 유효. 일부 환경에서 kubelet
#   webhook 비활성화면 다르게 동작 가능. 매처 외부 정보.

schema_version: "0.1"
id: R-INDIRECT-11
description: "get/create on nodes/proxy -> kubelet API 직접 호출로 임의 Pod exec, 토큰 추출"
category: indirect
severity: critical

match_any_of:
  - { api_group: "", resource: "nodes/proxy", verb: "get" }
  - { api_group: "", resource: "nodes/proxy", verb: "create" }

# 5개 출처 매트릭스 매핑 (룰셋 검증 인덱스 2026-05-09 기준): K8s + KS + RT + RP
# (KR은 별도 룰로 다루지 않음 — 매트릭스 검증에서 확인된 누락)
sources:
  - type: official
    name: "K8s - Kubelet authentication/authorization"
    url:  "https://kubernetes.io/docs/reference/access-authn-authz/kubelet-authn-authz/"
  - type: official
    name: "K8s - RBAC Good Practices: proxy subresource of Nodes"
    url:  "https://kubernetes.io/docs/concepts/security/rbac-good-practices/#proxy-subresource-of-nodes"
  - type: tool
    name: "KubiScan (KS) - nodes/proxy 권한"
    url:  "https://github.com/cyberark/KubiScan"
  - type: tool
    name: "rbac-tool (RT) - nodes/proxy 권한"
    url:  "https://github.com/alcideio/rbac-tool"
  - type: tool
    name: "rbac-police (RP) - kubelet API access (archived 2025-04, 카탈로그 유효)"
    url:  "https://github.com/PaloAltoNetworks/rbac-police"
