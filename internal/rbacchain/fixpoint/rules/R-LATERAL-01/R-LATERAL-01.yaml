# Rule schema v0
# 매칭 단위: atomic permission triple (api_group, resource, verb)
# 의미: PolicyRule이 triple (g, r, v)를 grant한다 ==
#       (g in apiGroups OR "*" in apiGroups)
#   AND (r in resources  OR "*" in resources)
#   AND (v in verbs       OR "*" in verbs)
# resourceNames: 매칭에서는 무시. evidence에만 기록.
# nonResourceURLs: 무시.
# match_any_of: triple 중 하나라도 grant되면 매치 (OR).
#
# R-LATERAL-01 (구 R-INDIRECT-12): cluster-admin 도달이 아닌 lateral / 방어 회피.
# 매처는 권한만 보고 매치. 보고서/그래프 빌더에서 "lateral" 카테고리로 분류해 직접
# 권한 상승 룰들과 명확히 구분 (severity 표기 별도).
#
# 매칭 결정 (2026-05-10):
# 2 resources × 2 verbs = 4 triple OR.
#   (a) nodes (본 리소스) — taints/labels 수정으로 스케줄링 조작
#   (b) nodes/status — status 조작으로 스케줄링 결정에 영향
#   둘 다 update와 patch 모두 verb로 검사.
#
# 도달 모델 — 권한 상승 아님:
#   1) 보안 DaemonSet (Falco, Sysdig 등)이 도는 노드에 NoExecute taint 추가
#   2) 그 Pod이 evict됨 → 노드의 활동이 모니터링되지 않음
#   3) attacker가 그 노드에서 다른 권한 상승 시도를 들키지 않고 진행 가능
#   효과: cluster-admin 토큰 직접 획득은 없음. 다른 룰의 chain에 합류해 침투 진척에
#   기여하는 보조 단계.
#
# 카테고리 분리 이유 (룰 5번 충돌 검토):
#   "기록한 룰 모두 탐지" 원칙과 "권한 상승 도구" 스코프 사이의 균형. 5개 출처 중
#   rbac-police만 modify_node_status를 Low로 다룸. 우리는 별도 R-LATERAL 카테고리로
#   넣어 운영자에게 위협 모델 차이를 명시.
#
# severity:
#   "warning"으로 표기 (critical 아님). 보고서가 R-DIRECT/R-INDIRECT 룰들과 구분
#   가능하게.

schema_version: "0.1"
id: R-LATERAL-01
description: "update/patch on nodes or nodes/status -> taints/labels 조작으로 스케줄링 변경, 보안 DaemonSet 회피"
category: lateral
severity: warning

match_any_of:
  - { api_group: "", resource: "nodes",        verb: "update" }
  - { api_group: "", resource: "nodes",        verb: "patch"  }
  - { api_group: "", resource: "nodes/status", verb: "update" }
  - { api_group: "", resource: "nodes/status", verb: "patch"  }

# 5개 출처 매트릭스 매핑 (룰셋 검증 인덱스 2026-05-09 기준): RP만 (Low)
sources:
  - type: official
    name: "K8s - Taints and Tolerations"
    url:  "https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/"
  - type: tool
    name: "rbac-police (RP) - modify_node_status (Low severity, archived 2025-04, 카탈로그 유효)"
    url:  "https://github.com/PaloAltoNetworks/rbac-police"
