# Rule schema v0
# 매칭 단위: atomic permission triple (api_group, resource, verb)
# 의미: PolicyRule이 triple (g, r, v)를 grant한다 ==
#       (g in apiGroups OR "*" in apiGroups)
#   AND (r in resources  OR "*" in resources)
#   AND (v in verbs       OR "*" in verbs)
# resourceNames: 매칭에서는 무시. evidence에만 기록.
# nonResourceURLs: 무시.
# match_any_of: triple 중 하나라도 grant되면 매치 (OR).
#
# R-INDIRECT-01 단독 매칭 결정 (2026-05-10):
# pods create 단독으로 매치한다. "같은 NS의 강한 SA 존재"는 매치 조건이 아니라
# 그래프 빌더 단계의 chain 분석 책임. 매처는 "이 subject에 pods create가 있다"는
# 사실만 보고. 따라서 같은 NS에 강한 SA가 없어 실제로는 권한 상승 못 하는 케이스도
# 매치된다 — false positive가 아니라 evidence이고, 후속 단계가 chain을 끊음.
#
# 미고려 정밀화 (그래프 빌더 / Phase 후반):
#   - victim SA의 automountServiceAccountToken: false → 토큰 안 마운트되어 무력
#   - PSA(Pod Security Admission) 제약 → 정상 image 못 띄우는 NS
#   - Pod admission webhook이 serviceAccountName을 강제로 default로 바꾸는 경우
# 위 조건들은 RBAC 외부라 매처에서는 다루지 않음.
#
# subresource (별도 룰):
#   pods/exec, pods/attach, pods/portforward → R-INDIRECT-02
#   pods/ephemeralcontainers                   → R-INDIRECT-03
#   pods/binding, pods/eviction 등은 권한 상승 벡터 아님 (스코프 외)
# 워크로드 컨트롤러 (Deployment 등)를 통한 우회 → R-INDIRECT-04 (별도 룰)

schema_version: "0.1"
id: R-INDIRECT-01
description: "create on pods -> spec.serviceAccountName으로 같은 NS 임의 SA를 마운트한 Pod 생성 가능"
category: indirect
severity: critical

match_any_of:
  - api_group: ""
    resource:  "pods"
    verb:      "create"

# 5개 출처 매트릭스 매핑 (룰셋 검증 인덱스 2026-05-09 기준): K8s + KS + RT + KR + RP
sources:
  - type: official
    name: "K8s - RBAC Good Practices: Workload creation"
    url:  "https://kubernetes.io/docs/concepts/security/rbac-good-practices/#workload-creation"
  - type: tool
    name: "KubiScan (KS) - Create Pod"
    url:  "https://github.com/cyberark/KubiScan"
  - type: tool
    name: "rbac-tool (RT) - Create Workload"
    url:  "https://github.com/alcideio/rbac-tool"
  - type: tool
    name: "krane (KR) - Pod creation 권한"
    url:  "https://github.com/appvia/krane"
  - type: tool
    name: "rbac-police (RP) - assign_sa (archived 2025-04, 카탈로그로 유효)"
    url:  "https://github.com/PaloAltoNetworks/rbac-police"
  - type: writeup
    name: "BishopFox - Bad Pods (시나리오 참조)"
    url:  "https://bishopfox.com/blog/kubernetes-pod-privilege-escalation"
