# Rule schema v0
# 매칭 단위: atomic permission triple (api_group, resource, verb)
# 의미: PolicyRule이 triple (g, r, v)를 grant한다 ==
#       (g in apiGroups OR "*" in apiGroups)
#   AND (r in resources  OR "*" in resources)
#   AND (v in verbs       OR "*" in verbs)
# resourceNames: 매칭에서는 무시. evidence에만 기록.
# nonResourceURLs: 무시.
# match_any_of: triple 중 하나라도 grant되면 매치 (OR).
#
# R-INDIRECT-02 단독 매칭 결정 (2026-05-10):
# 3개 subresource × 2개 verb = 6 triple OR. 하나라도 가지면 위험으로 판정.
# pods/exec, pods/attach, pods/portforward 모두 동일한 메커니즘 (실행 중 Pod의
# SA 토큰 추출 또는 동등 효과)이므로 단독 매치로 충분.
#
# verb 결정:
#   K8s API 서버는 pods/exec 등에 대해 POST=create, GET=get 둘 다 받는다.
#   kubectl은 보통 POST(create)를 쓰지만 다른 클라이언트가 GET을 쓸 수 있음.
#   완전성 위해 두 verb 모두 포함.
#
# subresource 매칭 (스키마 v0 한계):
#   매처는 resource 문자열을 literal 'in' 매칭. 따라서:
#   - PolicyRule resources=["pods"]는 "pods/exec"와 매치 안 됨 (의도대로 — K8s
#     RBAC도 pods와 pods/exec를 별개 리소스로 취급).
#   - PolicyRule resources=["*"]는 매치됨 (전체 wildcard).
#   - PolicyRule resources=["pods/*"] 같은 subresource wildcard는 K8s RBAC가
#     공식적으로 지원하지 않는 패턴. 매처도 literal 비교라 매치 안 됨 — 표준
#     준수 측면에서 의도된 동작.
#
# 미고려 정밀화 (그래프 빌더 / Phase 후반):
#   - victim Pod이 실행 중이고 강한 SA가 마운트되어 있어야 실제 권한 상승.
#   - automountServiceAccountToken: false인 victim Pod은 token 파일 없음.
#   위 조건들은 RBAC 외부 데이터로 graph 단계 책임.

schema_version: "0.1"
id: R-INDIRECT-02
description: "create/get on pods/exec|attach|portforward -> 실행 중 Pod 컨테이너에서 그 Pod SA 토큰 또는 동등 효과 획득"
category: indirect
severity: critical

match_any_of:
  - api_group: ""
    resource:  "pods/exec"
    verb:      "create"
  - api_group: ""
    resource:  "pods/exec"
    verb:      "get"
  - api_group: ""
    resource:  "pods/attach"
    verb:      "create"
  - api_group: ""
    resource:  "pods/attach"
    verb:      "get"
  - api_group: ""
    resource:  "pods/portforward"
    verb:      "create"
  - api_group: ""
    resource:  "pods/portforward"
    verb:      "get"

# 5개 출처 매트릭스 매핑 (룰셋 검증 인덱스 2026-05-09 기준): K8s + KS + RT + KR + RP
sources:
  - type: official
    name: "K8s - RBAC Good Practices: Workload creation 부분(exec)"
    url:  "https://kubernetes.io/docs/concepts/security/rbac-good-practices/#workload-creation"
  - type: tool
    name: "KubiScan (KS) - Exec Into Pod / Attach"
    url:  "https://github.com/cyberark/KubiScan"
  - type: tool
    name: "rbac-tool (RT) - Exec into Pod"
    url:  "https://github.com/alcideio/rbac-tool"
  - type: tool
    name: "krane (KR) - exec/attach 권한"
    url:  "https://github.com/appvia/krane"
  - type: tool
    name: "rbac-police (RP) - exec_into_pods 계열 (archived 2025-04, 카탈로그로 유효)"
    url:  "https://github.com/PaloAltoNetworks/rbac-police"
  - type: writeup
    name: "BishopFox - Bad Pods (시나리오 참조)"
    url:  "https://bishopfox.com/blog/kubernetes-pod-privilege-escalation"
