# Schema v1 (2026-05-16 신규).
#
# EKS aws-auth ConfigMap 변경 → cluster-admin.
# kube-system NS의 aws-auth ConfigMap은 EKS에서 IAM ARN ↔ K8s 사용자/그룹 매핑 보관.
# update/patch 권한자가 mapRoles/mapUsers에 system:masters 그룹을 추가하면 cluster-admin.
#
# 원칙 3 (유연성 금지) 검토:
#   EKS 전용 룰. 다른 클러스터(GKE/AKS/on-prem)에서는 의미 없음.
#   → `opt_in_flag: include-eks-specific`로 CLI 플래그 뒤에 둠. default 활성 X.
#   룰 로더가 플래그 확인 후 활성/비활성 분기.
#
# schema v1 사용:
#   match_all_of + nested match_any_of: update/patch 두 verb OR
#   resource_names: ["aws-auth"] — aws-auth ConfigMap만
#   within_namespaces: ["kube-system"] — kube-system NS만
#
# fixpoint transition 매핑 (1:1):
#   transition_R_INDIRECT_16 → cluster-admin (*,*,*,*) 흡수.

schema_version: "1.0"
id: R-INDIRECT-16
description: "EKS kube-system/aws-auth ConfigMap update/patch -> system:masters mapping 추가 가능 -> cluster-admin"
category: indirect
severity: critical
opt_in_flag: "include-eks-specific"

match_all_of:
  - match_any_of:
      - api_group: ""
        resource:  "configmaps"
        verb:      "update"
        resource_names: ["aws-auth"]
        within_namespaces: ["kube-system"]
      - api_group: ""
        resource:  "configmaps"
        verb:      "patch"
        resource_names: ["aws-auth"]
        within_namespaces: ["kube-system"]

sources:
  - type: tool
    name: "rbac-police - eks_modify_aws_auth"
    url:  "https://github.com/PaloAltoNetworks/rbac-police/blob/main/lib/eks_modify_aws_auth.rego"
  - type: tool
    name: "IceKube - UPDATE_AWS_AUTH"
    url:  "https://github.com/ReversecLabs/IceKube"
  - type: vendor
    name: "AWS EKS - aws-auth ConfigMap"
    url:  "https://docs.aws.amazon.com/eks/latest/userguide/auth-configmap.html"
