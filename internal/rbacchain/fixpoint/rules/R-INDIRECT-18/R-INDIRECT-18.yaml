# Rule schema v0
# 매칭 단위: atomic permission triple (api_group, resource, verb)
# 의미: PolicyRule이 triple (g, r, v)를 grant한다 ==
#       (g in apiGroups OR "*" in apiGroups)
#   AND (r in resources  OR "*" in resources)
#   AND (v in verbs       OR "*" in verbs)
# resourceNames: 매칭에서는 무시. evidence에만 기록.
# nonResourceURLs: 무시.
# match_any_of: triple 중 하나라도 grant되면 매치 (OR).
#
# R-INDIRECT-18 단독 매칭 결정 (2026-05-10):
# 2 resources × 3 verbs = 6 triple OR. ValidatingAdmissionPolicy 또는
# ValidatingAdmissionPolicyBinding에 create/update/patch 단독으로 admission CEL
# 정책 조작 가능. K8s 1.30+에서 도입된 새 메커니즘.
#
# R-INDIRECT-08 (webhook configurations)와 책임 분리:
#   R-INDIRECT-08 — admission webhook (외부 HTTP 서버 콜)
#   R-INDIRECT-18 — admission policy (CEL 표현식, 클러스터 내 평가)
#   둘 다 admission 가로채기지만 메커니즘이 다름. 매칭 대상 리소스도 다름.
#
# 도달 모델 (점진적 침투):
#   R-INDIRECT-08처럼 즉시 cluster-admin 아님. CEL 정책으로 특정 admission 동작 우회
#   가능 — 예: "이 NS의 Pod 생성 시 강한 SA 강제 마운트" 같은 mutating 정책. K8s 1.32+
#   에서 MutatingAdmissionPolicy도 도입 예정 — 향후 본 룰에 추가 검토.
#
# K8s 버전 종속성:
#   ValidatingAdmissionPolicy GA = 1.30. 1.29 이하 클러스터에는 이 리소스 자체 없음
#   → 매처는 PolicyRule이 없으므로 자연 비매치. EKS의 K8s 버전 분포 따라 실효성 차이.

schema_version: "0.1"
id: R-INDIRECT-18
description: "create/update/patch on validating admission policies/bindings -> CEL admission 정책 조작 (K8s 1.30+)"
category: indirect
severity: critical

match_any_of:
  - { api_group: "admissionregistration.k8s.io", resource: "validatingadmissionpolicies",        verb: "create" }
  - { api_group: "admissionregistration.k8s.io", resource: "validatingadmissionpolicies",        verb: "update" }
  - { api_group: "admissionregistration.k8s.io", resource: "validatingadmissionpolicies",        verb: "patch" }
  - { api_group: "admissionregistration.k8s.io", resource: "validatingadmissionpolicybindings",  verb: "create" }
  - { api_group: "admissionregistration.k8s.io", resource: "validatingadmissionpolicybindings",  verb: "update" }
  - { api_group: "admissionregistration.k8s.io", resource: "validatingadmissionpolicybindings",  verb: "patch" }
  # delete/deletecollection: 정책·바인딩 삭제 = admission 검증 통째 무력화(가드레일 제거 핵심 벡터)
  - { api_group: "admissionregistration.k8s.io", resource: "validatingadmissionpolicies",        verb: "delete" }
  - { api_group: "admissionregistration.k8s.io", resource: "validatingadmissionpolicies",        verb: "deletecollection" }
  - { api_group: "admissionregistration.k8s.io", resource: "validatingadmissionpolicybindings",  verb: "delete" }
  - { api_group: "admissionregistration.k8s.io", resource: "validatingadmissionpolicybindings",  verb: "deletecollection" }

# 5개 출처 매트릭스 매핑 (룰셋 검증 인덱스 2026-05-09 기준): RT만
sources:
  - type: official
    name: "K8s - Validating Admission Policy"
    url:  "https://kubernetes.io/docs/reference/access-authn-authz/validating-admission-policy/"
  - type: tool
    name: "rbac-tool (RT) - validating admission policy 권한"
    url:  "https://github.com/alcideio/rbac-tool"
