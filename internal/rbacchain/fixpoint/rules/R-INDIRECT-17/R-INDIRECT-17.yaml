# Schema v1 (2026-05-21 마이그레이션, R-INDIRECT-07과 동일 패턴).
#
# 이전 v0 한계 (정확성 5번 부분 위배):
#   v0는 `secrets {create | update | patch}` 3-triple OR. 그러나 K8s 1.24+에서
#   "type=service-account-token Secret 직접 발급 -> 토큰 탈취" 공격을 성립시키려면
#   create/update/patch만으론 부족. **새로 만든 Secret의 .data.token 을 읽어야**
#   하므로 secrets get(또는 list) 권한이 함께 필요.
#
#   rbac-police issue_token_secrets.rego TODO 발췌:
#     # NOTE: this used to also include the verbs "patch" and "update"
#     # but since they don't allow creating new secrets, all they enable
#     # is fixating the token of an existing token Secret. We're keeping
#     # "create" though even though create alone isn't enough since you
#     # cannot retreive the secret. Tracking issue: ...
#
#   즉 v0는 over-broad — `secrets create` 만 있고 get 권한이 없는 SA(예: ns 내
#   bootstrap-only controller)도 모두 매치 -> false positive 다수.
#
# v1 정확화:
#   match_all_of로 두 조건을 AND:
#     (a) secrets 에 create OR update OR patch  (Secret 발급/조작 능력)
#     (b) secrets 에 get                         (만든 토큰을 실제로 읽기)
#
#   list 는 (b)에 포함하지 않음 - list는 selector 기반이라 정적 분석에서 토큰
#   재현이 보장되지 않고, 보수적으로 get 한 verb만으로도 충분 (실제 공격에서
#   `kubectl get secret <name> -o yaml`이 표준 경로).
#
# 남는 한계 (의도된):
#   K8s RBAC API spec에 Secret type 필터가 없음 - (a)+(b) 둘 다 보유한 SA는
#   여전히 모든 Secret type을 대상으로 매치된다. type 필터는 RBAC 외부 컨텍스트
#   (admission webhook, OPA 등) 영역.
#
# verb 결정 ((a) 내부):
#   create - 새 Secret 만들 때 type 지정. controller 가 token 자동 채움. **표준 경로**.
#   update - 기존 Secret의 type/annotation 변경하여 token 강제 채움 가능.
#   patch  - update 와 동등 효과. 포함.
#
# R-INDIRECT-05 (read 경로) vs R-INDIRECT-17 (write+read 결합) 책임 분리:
#   05 - 이미 존재하는 (수동 또는 1.23 이하 자동) token Secret 읽기 (단독 get).
#   17 - 새 token Secret 발급 + 그 토큰 읽기 (create/update/patch AND get).
#   둘은 보완 관계 - 17이 매치되는 SA는 05도 매치(get 보유). 17은 더 강한 능력.

schema_version: "1.0"
id: R-INDIRECT-17
description: "secrets (create|update|patch) AND secrets get -> type=service-account-token Secret 발급 + 토큰 탈취 (1.24+ 우회)"
category: indirect
severity: critical

match_all_of:
  - match_any_of:
      - api_group: ""
        resource:  "secrets"
        verb:      "create"
      - api_group: ""
        resource:  "secrets"
        verb:      "update"
      - api_group: ""
        resource:  "secrets"
        verb:      "patch"
  - api_group: ""
    resource:  "secrets"
    verb:      "get"

# 5개 출처 매트릭스 매핑 (룰셋 검증 인덱스 2026-05-21 갱신): RP + K8s 공식
sources:
  - type: tool
    name: "rbac-police (RP) - issue_token_secrets (archived 2025-04, 카탈로그 유효; TODO 주석이 v1 정확화 근거)"
    url:  "https://github.com/PaloAltoNetworks/rbac-police"
  - type: official
    name: "K8s - Manually create a long-lived API token for a ServiceAccount"
    url:  "https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/#manually-create-a-long-lived-api-token-for-a-serviceaccount"
  - type: official
    name: "K8s 1.24 release notes - 수동 token Secret 메커니즘 유지"
    url:  "https://kubernetes.io/blog/2022/04/13/bound-service-account-tokens/"
