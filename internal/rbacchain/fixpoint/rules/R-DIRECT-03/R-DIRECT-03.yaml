# Rule schema v0
# 매칭 단위: atomic permission triple (api_group, resource, verb)
# 의미: PolicyRule이 triple (g, r, v)를 grant한다 ==
#       (g in apiGroups OR "*" in apiGroups)
#   AND (r in resources  OR "*" in resources)
#   AND (v in verbs       OR "*" in verbs)
# resourceNames: 매칭에서는 무시. evidence에만 기록.
# nonResourceURLs: 무시.
# match_any_of: triple 중 하나라도 grant되면 매치 (OR).
#
# R-DIRECT-03 단독 매칭 결정 (2026-05-10):
# impersonate verb가 잡히는 모든 리소스를 OR로 모은다. 한 subject가 어느 하나라도
# 가지면 위험이라 단독 매치로 충분하다. R-DIRECT-01/02와 동일 논리.
#
# 공식 문서 근거 (User Impersonation):
#   core ("")                  : users, groups, serviceaccounts
#   "authentication.k8s.io"   : uids, userextras/<extra-name>
#
# 알려진 한계 (스키마 v0):
#   userextras는 K8s 공식상 "userextras/<extra-name>" subresource 패턴으로만
#   PolicyRule에 표현된다 (예: resources: ["userextras/scopes"]). 현재 매처는
#   리소스 문자열 literal 매칭이라 이 형태를 잡으려면 subresource-aware 매칭이
#   필요하다 — 스키마 확장 전까지 R-DIRECT-03에는 userextras를 넣지 않는다.
#   결과: PolicyRule이 wildcard (resources: ["*"])이면 어차피 매치, 명시적
#   "userextras/scopes" 같은 케이스만 false negative. v1에서 해결 예정.
#   (정직성 원칙: 이 갭은 룰을 넣어도 가짜로 잡히지 않으므로 dead code 회피.)

schema_version: "0.1"
id: R-DIRECT-03
description: "impersonate verb on users/groups/serviceaccounts/uids -> 다른 신원으로 가장하여 그 권한 전체 사용 가능"
category: direct
severity: critical

match_any_of:
  - api_group: ""
    resource:  "users"
    verb:      "impersonate"
  - api_group: ""
    resource:  "groups"
    verb:      "impersonate"
  - api_group: ""
    resource:  "serviceaccounts"
    verb:      "impersonate"
  - api_group: "authentication.k8s.io"
    resource:  "uids"
    verb:      "impersonate"

# 5개 출처 매트릭스 매핑 (룰셋 검증 인덱스 2026-05-09 기준): K8s + KS + RT + KR + RP
sources:
  - type: official
    name: "K8s - User Impersonation"
    url:  "https://kubernetes.io/docs/reference/access-authn-authz/authentication/#user-impersonation"
  - type: tool
    name: "KubiScan (KS) - impersonate verb 검출"
    url:  "https://github.com/cyberark/KubiScan"
  - type: tool
    name: "rbac-tool (RT) - Modify Roles or Role Bindings 계열 (impersonate 포함)"
    url:  "https://github.com/alcideio/rbac-tool"
  - type: tool
    name: "krane (KR) - impersonate 권한 보유 식별"
    url:  "https://github.com/appvia/krane"
  - type: tool
    name: "rbac-police (RP) - user-impersonation 룰 (archived 2025-04, 카탈로그로 유효)"
    url:  "https://github.com/PaloAltoNetworks/rbac-police"
