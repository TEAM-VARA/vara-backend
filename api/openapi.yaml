openapi: 3.0.3
info:
  title: VARA Backend API
  version: 0.1.0
  description: |
    VARA SaaS 백엔드 API 명세.

    네 축으로 구성된다:
    1) **Agent 인제스천** — Cluster Reader / eBPF / SBOM 에이전트가 푸시하는 데이터를
       PostgreSQL(`pods` / `traffic` / `sboms` / `cves`) 에 적재.
    2) **Inventory** — 적재된 자산(Pod/이미지/CVE)을 조회.
    3) **ISMS-P 매핑** — Evidence 임베딩 + pgvector 유사도 검색 + 룰 엔진으로
       통제항목 준수 상태 판정.
    4) **Tenant / Auth / Dashboard / Topology / Scoring** — SaaS 운영용 관리 API.

    핸들러 본문이 비어있는 엔드포인트는 호출 시 404/501 일 수 있으나, 본 문서는 구현 계약
    역할을 한다 — 핸들러 채워가는 동안 본 문서를 입력 스펙으로 사용한다.

servers:
  - url: http://localhost:8080
    description: 로컬 docker-compose
  - url: https://api.vara.example.com
    description: 운영 (placeholder)

tags:
  - name: health
    description: 서버 / DB 상태 확인
  - name: agents
    description: VARA Agent 인제스천 엔드포인트
  - name: auth
    description: 로그인 / 토큰 / 현재 사용자
  - name: tenant
    description: 테넌트(고객) CRUD — VARA_ADMIN 전용
  - name: pod
    description: Pod 자산 조회
  - name: cve
    description: 이미지 / CVE 조회
  - name: isms-p
    description: ISMS-P 통제항목 / 매핑
  - name: evidence
    description: 증적(Evidence) 등록 / 조회 / 벡터 검색
  - name: scoring
    description: 자산 위험 점수
  - name: topology
    description: Pod 간 통신 토폴로지
  - name: dashboard
    description: 요약 지표 / 위젯

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      tags: [health]
      summary: 헬스 체크 (Postgres + Redis ping 포함)
      operationId: healthz
      security: []
      responses:
        "200":
          description: 정상
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
              examples:
                ok: { value: { status: "ok" } }
        "503":
          description: 의존성(DB/Redis) 응답 없음
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
              examples:
                postgres_down: { value: { status: "postgres down" } }
                redis_down:    { value: { status: "redis down" } }

  # ──────────────────────────────────────────────────────────────
  # Agent 인제스천
  # ──────────────────────────────────────────────────────────────

  /api/v1/agents/cluster-reader/pods:
    post:
      tags: [agents]
      summary: Cluster Reader Agent → Pod 목록/이벤트 수신
      description: |
        Cluster Reader Agent 가 Watch API 로 감지한 Pod 정보를 배치로 푸시한다.
        `pods` 테이블에 적재 (pod_uid PK, ON CONFLICT 갱신 가정).
      operationId: ingestPods
      security:
        - mtlsAgent: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PodEventBatch" }
            examples:
              created:
                value:
                  cluster: prod-eks
                  events:
                    - event_type: CREATED
                      ts: "2026-05-03T10:00:00Z"
                      pod_uid: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
                      pod_name: web-1
                      namespace: default
                      node_name: ip-10-0-1-23
                      ip: 10.0.1.45
                      image: nginx:1.27
                      image_digest: "sha256:abcd..."
      responses:
        "200":
          description: 수신 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestionAck" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/agents/cluster-reader/services:
    post:
      tags: [agents]
      summary: Cluster Reader Agent → Service 수신
      description: |
        K8s Service(LoadBalancer / NodePort / ClusterIP) 정보를 배치로 푸시한다.
      operationId: ingestServices
      security:
        - mtlsAgent: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: 핸들러 본문은 TODO. 현재는 어떤 JSON 도 200 으로 ack.
      responses:
        "200":
          description: 수신 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestionAck" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/agents/cluster-reader/nodes:
    post:
      tags: [agents]
      summary: Cluster Reader Agent → Node 수신
      description: |
        K8s Node 정보(이름/IP/용량/라벨 등)를 배치로 푸시한다.
      operationId: ingestNodes
      security:
        - mtlsAgent: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: 핸들러 본문은 TODO. 현재는 어떤 JSON 도 200 으로 ack.
      responses:
        "200":
          description: 수신 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestionAck" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/agents/ebpf/traffic:
    post:
      tags: [agents]
      summary: eBPF Agent → 트래픽 데이터 수신
      operationId: ingestTraffic
      security:
        - mtlsAgent: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TrafficBatch" }
      responses:
        "200":
          description: 수신 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestionAck" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api/v1/agents/sbom:
    post:
      tags: [agents]
      summary: SBOM 적재 (Trivy / syft 산출물)
      operationId: ingestSBOM
      security:
        - mtlsAgent: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SBOMRequest" }
      responses:
        "200":
          description: 수신 성공
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IngestionAck" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ──────────────────────────────────────────────────────────────
  # Auth
  # ──────────────────────────────────────────────────────────────

  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: 로그인 — access/refresh 토큰 발급
      operationId: authLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
            examples:
              admin:
                value: { email: "admin@example.com", password: "********" }
      responses:
        "200":
          description: 로그인 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/LoginResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: refresh_token 으로 access_token 재발급
      operationId: authRefresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: 재발급 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/LoginResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: 로그아웃 (서버측 refresh_token 무효화)
      operationId: authLogout
      responses:
        "204":
          description: 로그아웃 완료
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: 현재 로그인된 사용자 정보
      operationId: authMe
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ──────────────────────────────────────────────────────────────
  # Tenant
  # ──────────────────────────────────────────────────────────────

  /api/v1/tenants:
    get:
      tags: [tenant]
      summary: 테넌트 목록 (VARA_ADMIN)
      operationId: listTenants
      parameters:
        - { in: query, name: limit,  schema: { type: integer, default: 100, maximum: 500 } }
        - { in: query, name: offset, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/Tenant" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [tenant]
      summary: 테넌트 신규 생성 (VARA_ADMIN)
      operationId: createTenant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantCreateRequest" }
      responses:
        "201":
          description: 생성됨
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Tenant" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/tenants/{tenant_id}:
    parameters:
      - { in: path, name: tenant_id, required: true, schema: { type: string } }
    get:
      tags: [tenant]
      summary: 테넌트 상세
      operationId: getTenant
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Tenant" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [tenant]
      summary: 테넌트 정보 수정
      operationId: updateTenant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantUpdateRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Tenant" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [tenant]
      summary: 테넌트 삭제 (VARA_ADMIN)
      operationId: deleteTenant
      responses:
        "204": { description: 삭제됨 }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ──────────────────────────────────────────────────────────────
  # Pod (자산)
  # ──────────────────────────────────────────────────────────────

  /api/v1/pods:
    get:
      tags: [pod]
      summary: Pod 목록
      operationId: listPods
      parameters:
        - { in: query, name: tenant_id, schema: { type: string }, description: "관리자(VARA_ADMIN) 만 사용. 일반 사용자는 자동 주입" }
        - { in: query, name: namespace, schema: { type: string } }
        - { in: query, name: cluster,   schema: { type: string } }
        - { in: query, name: q,         schema: { type: string }, description: "이름/이미지 부분 일치 검색" }
        - { in: query, name: limit,     schema: { type: integer, default: 100, maximum: 500 } }
        - { in: query, name: offset,    schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/Pod" }

  /api/v1/pods/{pod_uid}:
    parameters:
      - { in: path, name: pod_uid, required: true, schema: { type: string } }
    get:
      tags: [pod]
      summary: Pod 상세
      operationId: getPod
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Pod" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [pod]
      summary: Pod 레코드 삭제 (수동 정리용)
      operationId: deletePod
      responses:
        "204": { description: 삭제됨 }
        "404": { $ref: "#/components/responses/NotFound" }

  # ──────────────────────────────────────────────────────────────
  # CVE
  # ──────────────────────────────────────────────────────────────

  /api/v1/cves:
    get:
      tags: [cve]
      summary: CVE 목록 (필터)
      operationId: listCVEs
      parameters:
        - { in: query, name: severity, schema: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] } }
        - { in: query, name: image_digest, schema: { type: string } }
        - { in: query, name: cve_id, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, default: 100, maximum: 500 } }
        - { in: query, name: offset, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/CVE" }

  /api/v1/cves/by-image/{image_digest}:
    parameters:
      - { in: path, name: image_digest, required: true, schema: { type: string }, description: "URL-encoded sha256:..." }
    get:
      tags: [cve]
      summary: 특정 이미지의 CVE 목록
      operationId: listCVEsByImage
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          image_digest: { type: string }
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/CVE" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ──────────────────────────────────────────────────────────────
  # ISMS-P 통제항목
  # ──────────────────────────────────────────────────────────────

  /api/v1/isms-p/controls:
    post:
      tags: [isms-p]
      summary: ISMS-P 통제항목 등록 (임베딩 자동 생성)
      operationId: createISMSControl
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ISMSControlRequest" }
            examples:
              control_2_5_5:
                value:
                  code: "2.5.5"
                  title: 특수 권한 관리
                  body: |
                    관리자 권한 등 특수 권한은 사용자별 식별 가능한 별도의 계정으로 부여하고,
                    공용 계정 사용을 제한해야 한다. ...
      responses:
        "200":
          description: 등록 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ISMSControl" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      tags: [isms-p]
      summary: ISMS-P 통제항목 목록
      operationId: listISMSControls
      parameters:
        - { in: query, name: limit,  schema: { type: integer, default: 100, maximum: 500 } }
        - { in: query, name: offset, schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/ISMSControl" }

  /api/v1/isms-p/controls/{code}:
    parameters:
      - { in: path, name: code, required: true, schema: { type: string }, example: "2.5.5" }
    get:
      tags: [isms-p]
      summary: ISMS-P 통제항목 상세
      operationId: getISMSControl
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ISMSControl" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ──────────────────────────────────────────────────────────────
  # Evidence
  # ──────────────────────────────────────────────────────────────

  /api/v1/evidence:
    post:
      tags: [evidence]
      summary: Evidence 등록 (임베딩 자동 생성)
      operationId: createEvidence
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EvidenceRequest" }
            examples:
              cve_evidence:
                value:
                  tenant_id: tenant-001
                  source: cve
                  body: |
                    Pod web-1 (이미지 nginx:1.18) 에서 CVE-2023-44487 이 검출되었다.
                    심각도는 HIGH 이며 패치 미적용 상태이다.
      responses:
        "200":
          description: 등록 성공
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Evidence" }
        "400": { $ref: "#/components/responses/BadRequest" }
    get:
      tags: [evidence]
      summary: Evidence 목록
      operationId: listEvidence
      parameters:
        - { in: query, name: tenant_id, required: true, schema: { type: string } }
        - { in: query, name: source,    schema: { type: string }, description: "분류 필터 (`cve` / `traffic` / ...)" }
        - { in: query, name: limit,     schema: { type: integer, default: 100, maximum: 500 } }
        - { in: query, name: offset,    schema: { type: integer, default: 0 } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/Evidence" }

  /api/v1/vector-search/isms-p:
    post:
      tags: [evidence]
      summary: 통제 기준 Evidence 유사도 검색 (cosine)
      operationId: vectorSearchISMSP
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VectorSearchRequest" }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          control_code: { type: string, nullable: true }
                          query_text:   { type: string }
                          results:
                            type: array
                            items: { $ref: "#/components/schemas/EvidenceSearchResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ──────────────────────────────────────────────────────────────
  # ISMS-P 매핑
  # ──────────────────────────────────────────────────────────────

  /api/v1/isms-p/mappings/run:
    post:
      tags: [isms-p]
      summary: ISMS-P 매핑 실행 (벡터 검색 + 룰 엔진)
      operationId: runISMSPMapping
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MappingRunRequest" }
      responses:
        "200":
          description: 매핑 완료
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/MappingDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/isms-p/mappings:
    get:
      tags: [isms-p]
      summary: ISMS-P 매핑 결과 목록 (최신순)
      operationId: listISMSPMappings
      parameters:
        - { in: query, name: tenant_id, required: true, schema: { type: string } }
        - { in: query, name: control_code, schema: { type: string } }
        - { in: query, name: status, schema: { $ref: "#/components/schemas/MappingStatus" } }
        - { in: query, name: limit, schema: { type: integer, default: 100, maximum: 500 } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/MappingSummary" }

  /api/v1/isms-p/mappings/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [isms-p]
      summary: ISMS-P 매핑 결과 상세
      operationId: getISMSPMapping
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/MappingDetail" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ──────────────────────────────────────────────────────────────
  # Scoring (자산 위험 점수)
  # ──────────────────────────────────────────────────────────────

  /api/v1/scoring/assets:
    get:
      tags: [scoring]
      summary: 자산별 위험 점수 목록
      operationId: listAssetScores
      parameters:
        - { in: query, name: tenant_id, required: true, schema: { type: string } }
        - { in: query, name: min_score, schema: { type: number, format: double, minimum: 0, maximum: 1 } }
        - { in: query, name: order, schema: { type: string, enum: [score_desc, score_asc, recent], default: score_desc } }
        - { in: query, name: limit, schema: { type: integer, default: 100, maximum: 500 } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/AssetScore" }

  /api/v1/scoring/assets/{asset_id}:
    parameters:
      - { in: path, name: asset_id, required: true, schema: { type: string } }
    get:
      tags: [scoring]
      summary: 단일 자산의 위험 점수 상세
      operationId: getAssetScore
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AssetScore" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/scoring/recompute:
    post:
      tags: [scoring]
      summary: 위험 점수 재계산 트리거 (비동기 잡)
      operationId: recomputeScoring
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                tenant_id: { type: string }
                asset_ids:
                  type: array
                  items: { type: string }
                  description: 비어있으면 테넌트 전체 재계산
      responses:
        "202":
          description: accepted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          job_id: { type: string }
                          status: { type: string, enum: [QUEUED, RUNNING] }

  # ──────────────────────────────────────────────────────────────
  # Topology
  # ──────────────────────────────────────────────────────────────

  /api/v1/topology:
    get:
      tags: [topology]
      summary: Pod 간 통신 토폴로지 그래프
      description: |
        eBPF Agent 가 적재한 `traffic` 테이블을 집계해 Pod 간 통신 그래프를 구성한다.
        시간 윈도우(`since`/`until`)와 namespace/cluster 필터 지원.
      operationId: getTopology
      parameters:
        - { in: query, name: tenant_id, required: true, schema: { type: string } }
        - { in: query, name: cluster,   schema: { type: string } }
        - { in: query, name: namespace, schema: { type: string } }
        - { in: query, name: since, schema: { type: string, format: date-time } }
        - { in: query, name: until, schema: { type: string, format: date-time } }
        - { in: query, name: min_bytes, schema: { type: integer, format: int64, default: 0 } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/TopologyGraph" }

  /api/v1/topology/pods/{pod_uid}:
    parameters:
      - { in: path, name: pod_uid, required: true, schema: { type: string } }
    get:
      tags: [topology]
      summary: 특정 Pod 의 인접 노드 (1-hop)
      operationId: getPodTopology
      parameters:
        - { in: query, name: since, schema: { type: string, format: date-time } }
        - { in: query, name: until, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/TopologyGraph" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ──────────────────────────────────────────────────────────────
  # Dashboard
  # ──────────────────────────────────────────────────────────────

  /api/v1/dashboard/summary:
    get:
      tags: [dashboard]
      summary: 대시보드 상단 요약 카드
      operationId: getDashboardSummary
      parameters:
        - { in: query, name: tenant_id, required: true, schema: { type: string } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DashboardSummary" }

  /api/v1/dashboard/risk-overview:
    get:
      tags: [dashboard]
      summary: 위험도 분포 (CRITICAL/HIGH/MEDIUM/LOW)
      operationId: getDashboardRiskOverview
      parameters:
        - { in: query, name: tenant_id, required: true, schema: { type: string } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          buckets:
                            type: array
                            items: { $ref: "#/components/schemas/RiskBucket" }

  /api/v1/dashboard/recent-mappings:
    get:
      tags: [dashboard]
      summary: 최근 ISMS-P 매핑 결과 (위젯용)
      operationId: getDashboardRecentMappings
      parameters:
        - { in: query, name: tenant_id, required: true, schema: { type: string } }
        - { in: query, name: limit, schema: { type: integer, default: 10, maximum: 50 } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items: { $ref: "#/components/schemas/MappingSummary" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 일반 사용자 / 운영자 API. Authorization 헤더에 access_token.
    mtlsAgent:
      type: mutualTLS
      description: VARA Agent 인제스천 전용 (`internal/server/mtls.go` 별도 포트).

  responses:
    BadRequest:
      description: 요청 형식 오류
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: 인증 실패 (mTLS / JWT)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: 권한 부족 (RBAC)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: 리소스 없음
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: 서버 내부 오류
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    # ── 공통 ─────────────────────────────────────────────
    HealthResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, example: ok }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message]
          properties:
            message: { type: string }
            code:    { type: string }

    Envelope:
      type: object
      description: ISMS-P / Evidence / 운영 API 공통 응답 봉투
      required: [success]
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
        data:
          description: 엔드포인트별 페이로드 (각 엔드포인트의 200 응답에서 allOf 로 합성)
          oneOf:
            - type: object
            - type: array
            - type: "null"

    IngestionAck:
      type: object
      required: [received]
      properties:
        received: { type: boolean, example: true }
        accepted_count:
          type: integer
          description: 정상 적재된 이벤트 수
          example: 1

    # ── Agent 인제스천 ──────────────────────────────────
    PodEvent:
      type: object
      required: [event_type, pod_uid, pod_name, namespace]
      properties:
        event_type: { type: string, enum: [CREATED, UPDATED, DELETED] }
        ts:         { type: string, format: date-time }
        pod_uid:    { type: string, description: K8s metadata.uid (테이블 PK) }
        pod_name:   { type: string }
        namespace:  { type: string }
        node_name:  { type: string, nullable: true }
        ip:         { type: string, nullable: true }
        image:      { type: string, nullable: true }
        image_digest:
          type: string
          nullable: true
          description: "sha256:..."

    PodEventBatch:
      type: object
      required: [events]
      properties:
        cluster: { type: string }
        events:
          type: array
          items: { $ref: "#/components/schemas/PodEvent" }

    TrafficEvent:
      type: object
      required: [ts]
      properties:
        ts:      { type: string, format: date-time }
        src_ip:  { type: string, nullable: true }
        dst_ip:  { type: string, nullable: true }
        bytes:   { type: integer, format: int64, minimum: 0 }
        packets: { type: integer, format: int64, minimum: 0 }

    TrafficBatch:
      type: object
      required: [events]
      properties:
        cluster: { type: string }
        node:    { type: string }
        events:
          type: array
          items: { $ref: "#/components/schemas/TrafficEvent" }

    SBOMRequest:
      type: object
      required: [image, image_digest, raw_data]
      properties:
        image:        { type: string, example: nginx:1.27 }
        image_digest: { type: string, example: "sha256:abcd..." }
        scanner:      { type: string, example: trivy }
        raw_data:
          type: object
          description: 도구 원본 JSON 그대로 (`sboms.raw_data` JSONB)
          additionalProperties: true

    # ── Auth ─────────────────────────────────────────────
    Role:
      type: string
      enum: [VARA_ADMIN, ANALYST, VIEWER]

    User:
      type: object
      required: [id, email, role]
      properties:
        id:        { type: string }
        email:     { type: string, format: email }
        name:      { type: string }
        role:      { $ref: "#/components/schemas/Role" }
        tenant_id: { type: string, nullable: true, description: VARA_ADMIN 은 null 가능 }
        created_at: { type: string, format: date-time }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:    { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }

    LoginResponse:
      type: object
      required: [access_token, refresh_token, user]
      properties:
        access_token:  { type: string }
        refresh_token: { type: string }
        token_type:    { type: string, example: Bearer }
        expires_in:    { type: integer, format: int32, description: 초 단위 access_token 수명 }
        user:          { $ref: "#/components/schemas/User" }

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    # ── Tenant ───────────────────────────────────────────
    Tenant:
      type: object
      required: [id, name]
      properties:
        id:          { type: string }
        name:        { type: string }
        plan:        { type: string, enum: [TRIAL, STANDARD, ENTERPRISE], default: TRIAL }
        kube_clusters:
          type: array
          description: 연결된 클러스터 목록 (cluster_name)
          items: { type: string }
        created_at:  { type: string, format: date-time }
        updated_at:  { type: string, format: date-time }

    TenantCreateRequest:
      type: object
      required: [id, name]
      properties:
        id:   { type: string, description: URL-safe 식별자 }
        name: { type: string }
        plan: { type: string, enum: [TRIAL, STANDARD, ENTERPRISE] }

    TenantUpdateRequest:
      type: object
      properties:
        name: { type: string }
        plan: { type: string, enum: [TRIAL, STANDARD, ENTERPRISE] }
        kube_clusters:
          type: array
          items: { type: string }

    # ── Pod ──────────────────────────────────────────────
    Pod:
      type: object
      required: [pod_uid, pod_name, namespace]
      properties:
        pod_uid:      { type: string }
        pod_name:     { type: string }
        namespace:    { type: string }
        node_name:    { type: string, nullable: true }
        ip:           { type: string, nullable: true }
        image:        { type: string, nullable: true }
        image_digest: { type: string, nullable: true }
        cluster:      { type: string, nullable: true }
        created_at:   { type: string, format: date-time }

    # ── CVE ──────────────────────────────────────────────
    CVE:
      type: object
      required: [id, cve_id, image_digest]
      properties:
        id:           { type: integer, format: int64 }
        cve_id:       { type: string, example: "CVE-2023-44487" }
        image_digest: { type: string }
        severity:     { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL], nullable: true }

    # ── ISMS-P 통제항목 ─────────────────────────────────
    ISMSControlRequest:
      type: object
      required: [code, title, body]
      properties:
        code:  { type: string, example: "2.5.5" }
        title: { type: string }
        body:  { type: string, description: 통제항목 본문 (임베딩 대상 텍스트) }

    ISMSControl:
      type: object
      required: [id, code, title, body]
      properties:
        id:    { type: integer, format: int64 }
        code:  { type: string }
        title: { type: string }
        body:  { type: string }
        created_at: { type: string, format: date-time }

    # ── Evidence ────────────────────────────────────────
    EvidenceRequest:
      type: object
      required: [tenant_id, source, body]
      properties:
        tenant_id: { type: string }
        source:    { type: string, description: "분류 (자유) — `cve` / `traffic` / `sbom` / `pod` / `manual`" }
        body:      { type: string, description: 자연어 증적 본문 (임베딩 대상 텍스트) }

    Evidence:
      type: object
      required: [id, tenant_id, source, body]
      properties:
        id:        { type: integer, format: int64 }
        tenant_id: { type: string }
        source:    { type: string }
        body:      { type: string }
        created_at: { type: string, format: date-time }

    VectorSearchRequest:
      type: object
      required: [tenant_id]
      description: |
        `control_code` 또는 `query` 둘 중 하나는 반드시 제공해야 한다.
        `control_code` 가 주어지면 해당 통제항목의 `body` 를 query 로 사용.
      properties:
        tenant_id:    { type: string }
        control_code: { type: string, nullable: true }
        query:        { type: string, nullable: true, description: control_code 대신 직접 검색 텍스트 }
        top_k:        { type: integer, default: 10, minimum: 1, maximum: 100 }
        min_similarity: { type: number, format: double, default: 0.5, minimum: 0.0, maximum: 1.0 }
        source_filter:
          type: array
          items: { type: string }

    EvidenceSearchResult:
      type: object
      required: [evidence_id, source, body, similarity]
      properties:
        evidence_id: { type: integer, format: int64 }
        source:      { type: string }
        body:        { type: string }
        similarity:  { type: number, format: double, minimum: 0.0, maximum: 1.0 }

    # ── ISMS-P 매핑 ─────────────────────────────────────
    MappingRunRequest:
      type: object
      required: [tenant_id, control_code]
      properties:
        tenant_id:      { type: string }
        control_code:   { type: string, example: "2.5.5" }
        top_k:          { type: integer, default: 10, minimum: 1, maximum: 100 }
        min_similarity: { type: number,  format: double, default: 0.5 }
        use_rule_engine:
          type: boolean
          default: true
          description: false 면 검색 결과만 반환 (DB 저장 없음)
        source_filter:
          type: array
          items: { type: string }

    MappingStatus:
      type: string
      enum: [COMPLIANT, NON_COMPLIANT, NEEDS_REVIEW, UNKNOWN]

    RiskLevel:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]

    MappingSummary:
      type: object
      required: [id, tenant_id, control_code, status, risk_level]
      properties:
        id:           { type: integer, format: int64 }
        tenant_id:    { type: string }
        control_code: { type: string }
        status:       { $ref: "#/components/schemas/MappingStatus" }
        risk_level:   { $ref: "#/components/schemas/RiskLevel" }
        risk_score:   { type: number, format: double, minimum: 0.0, maximum: 1.0 }
        summary:      { type: string }
        created_at:   { type: string, format: date-time }

    MappingDetail:
      allOf:
        - $ref: "#/components/schemas/MappingSummary"
        - type: object
          properties:
            reason: { type: string }
            recommendations:
              type: array
              items: { type: string }
            evidence_ids:
              type: array
              items: { type: integer, format: int64 }
            evidence:
              type: array
              description: 매핑 근거로 사용된 Evidence 검색 결과 (run 응답에 포함)
              items: { $ref: "#/components/schemas/EvidenceSearchResult" }

    # ── Scoring ─────────────────────────────────────────
    AssetScore:
      type: object
      required: [asset_id, score, risk_level]
      properties:
        asset_id:    { type: string, description: "pod_uid / image_digest / cluster:ns:name 등" }
        asset_kind:  { type: string, enum: [pod, image, cluster] }
        tenant_id:   { type: string }
        score:       { type: number, format: double, minimum: 0.0, maximum: 1.0 }
        risk_level:  { $ref: "#/components/schemas/RiskLevel" }
        components:
          type: object
          description: 점수 구성요소 breakdown (가중합)
          properties:
            cve_severity:  { type: number, format: double }
            exposure:      { type: number, format: double }
            ismsp_mapping: { type: number, format: double }
        updated_at:  { type: string, format: date-time }

    # ── Topology ────────────────────────────────────────
    TopologyNode:
      type: object
      required: [id, kind]
      properties:
        id:        { type: string, description: "pod_uid 또는 외부 IP" }
        kind:      { type: string, enum: [pod, external] }
        label:     { type: string, description: pod_name 또는 IP }
        namespace: { type: string, nullable: true }
        cluster:   { type: string, nullable: true }
        image:     { type: string, nullable: true }

    TopologyEdge:
      type: object
      required: [src, dst]
      properties:
        src:     { type: string, description: src node id }
        dst:     { type: string, description: dst node id }
        bytes:   { type: integer, format: int64 }
        packets: { type: integer, format: int64 }
        first_seen: { type: string, format: date-time }
        last_seen:  { type: string, format: date-time }

    TopologyGraph:
      type: object
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items: { $ref: "#/components/schemas/TopologyNode" }
        edges:
          type: array
          items: { $ref: "#/components/schemas/TopologyEdge" }

    # ── Dashboard ───────────────────────────────────────
    DashboardSummary:
      type: object
      properties:
        pods_total:          { type: integer }
        cves_total:          { type: integer }
        cves_critical:       { type: integer }
        non_compliant_count: { type: integer, description: ISMS-P NON_COMPLIANT 매핑 수 }
        last_collected_at:   { type: string, format: date-time, nullable: true }

    RiskBucket:
      type: object
      required: [risk_level, count]
      properties:
        risk_level: { $ref: "#/components/schemas/RiskLevel" }
        count:      { type: integer }
