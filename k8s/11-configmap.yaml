# 전 서비스 공통 설정 (이미지 레지스트리, 비밀이 아닌 endpoint).
# 이미지 태그는 매니페스트 내부에 직접 박혀 있으므로 여기서는 endpoint 만 관리한다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: vara-compliance-config
  namespace: vara-compliance
data:
  EMBEDDING_SERVER_URL: "http://vara-embedding-server.vara-compliance.svc.cluster.local:9000/embed"
  VARA_API_BASE: "http://vara-api.vara-compliance.svc.cluster.local:8080"
  CLUSTER_NAME: "vara-test"
  CLOUD_PROVIDER: "aws"
  AWS_REGION: "ap-northeast-2"
  SERVER_PORT: "8080"
