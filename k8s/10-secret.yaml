# RDS 접속 정보 Secret (placeholder).
#
# !! 실제 적용 전에 아래 값들을 RDS 인스턴스 정보로 교체할 것 !!
#   - POSTGRES_HOST: RDS 엔드포인트 (vara-prod.xxxxx.ap-northeast-2.rds.amazonaws.com)
#   - POSTGRES_PASSWORD: RDS master 비밀번호
#
# 권장: kubectl create secret 으로 직접 생성하거나 External Secrets Operator 로 Secrets Manager 와 동기화.
# 평문 매니페스트로 비밀번호를 git 에 커밋하면 안 된다.
#
# 일회성 생성 예시:
#   kubectl -n vara-compliance create secret generic vara-postgres \
#     --from-literal=POSTGRES_HOST=vara-prod.xxxxx.ap-northeast-2.rds.amazonaws.com \
#     --from-literal=POSTGRES_PORT=5432 \
#     --from-literal=POSTGRES_USER=vara \
#     --from-literal=POSTGRES_PASSWORD='***REPLACE***' \
#     --from-literal=POSTGRES_DB=vara \
#     --from-literal=POSTGRES_SSLMODE=require

apiVersion: v1
kind: Secret
metadata:
  name: vara-postgres
  namespace: vara-compliance
type: Opaque
stringData:
  POSTGRES_HOST: REPLACE_WITH_RDS_ENDPOINT
  POSTGRES_PORT: "5432"
  POSTGRES_USER: vara
  POSTGRES_PASSWORD: REPLACE_WITH_RDS_PASSWORD
  POSTGRES_DB: vara
  POSTGRES_SSLMODE: require
