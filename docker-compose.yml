services:
  postgres:
    # pgvector image required for the 002_pgvector extension migration
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vara
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: vara
    ports:
      - "5432:5432"
    volumes:
      - vara-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vara -d vara"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    image: migrate/migrate
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path"
      - "/migrations"
      - "-database"
      - "postgres://vara:changeme@postgres:5432/vara?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  embedding:
    # BGE-M3 FastAPI embedding server
    build:
      context: .
      dockerfile: deployments/docker/embedding-server.Dockerfile
    expose:
      - "9000"
    volumes:
      - hf-cache:/cache/hf
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      embedding:
        condition: service_started
    env_file:
      - .env
    environment:
      SERVER_PORT: "8080"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: vara
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: vara
      POSTGRES_SSLMODE: disable
      REDIS_ADDR: redis:6379
      EMBEDDING_SERVER_URL: http://embedding:9000/embed
    ports:
      - "8080:8080"
    volumes:
      - trivy-cache:/var/cache/trivy
volumes:
  vara-pg-data:
  hf-cache:
  trivy-cache:
