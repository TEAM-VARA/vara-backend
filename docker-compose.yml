version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vara
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: vara
    ports:
      - "5432:5432"
    volumes:
      - vara-pg-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: .
    depends_on:
      - postgres
      - redis
    environment:
      SERVER_PORT: "8080"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: vara
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: vara
      POSTGRES_SSLMODE: disable
      REDIS_ADDR: redis:6379
    ports:
      - "8080:8080"

volumes:
  vara-pg-data:
