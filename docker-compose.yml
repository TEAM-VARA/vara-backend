services:
  postgres:
    # pgvector image required for the 002_pgvector extension migration
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vara
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: vara
    ports:
      - "5433:5432"
    volumes:
      - vara-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vara -d vara"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    image: migrate/migrate
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path"
      - "/migrations"
      - "-database"
      - "postgres://vara:changeme@postgres:5432/vara?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
  embedding:
    # BGE-M3 FastAPI embedding server
    build:
      context: .
      dockerfile: deployments/docker/embedding-server.Dockerfile
    expose:
      - "9000"
    volumes:
      - hf-cache:/cache/hf
    restart: unless-stopped
  ollama:
    # Qwen 2.5 7B LLM 추론 서버. 첫 부팅 시 모델 ~4.7GB 다운로드 후 캐시.
    image: ollama/ollama
    expose:
      - "11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list"]
      interval: 10s
      timeout: 5s
      retries: 12
  ollama-init:
    # 최초 기동 시 Qwen 모델을 pull. 이미 캐시되어 있으면 즉시 완료.
    image: ollama/ollama
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c", "ollama pull qwen2.5:7b"]
    restart: "no"
  backend:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      embedding:
        condition: service_started
      ollama:
        condition: service_healthy
    env_file:
      - .env
    environment:
      SERVER_PORT: "8080"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: vara
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: vara
      POSTGRES_SSLMODE: disable
      REDIS_ADDR: redis:6379
      EMBEDDING_SERVER_URL: http://embedding:9000/embed
      VLM_SERVER_URL: ${VLM_SERVER_URL:-http://ollama:11434}
      VLM_MODEL: ${VLM_MODEL:-qwen2.5:7b}
    ports:
      - "8081:8080"
    volumes:
      - trivy-cache:/var/cache/trivy
volumes:
  vara-pg-data:
  hf-cache:
  trivy-cache:
  ollama-models:
