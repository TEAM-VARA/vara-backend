services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vara
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: vara
    ports:
      - "5432:5432"
    volumes:
      - vara-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vara -d vara"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    image: migrate/migrate
    volumes:
      - ./migrations:/migrations:ro
    command:
      - "-path"
      - "/migrations"
      - "-database"
      - "postgres://vara:changeme@postgres:5432/vara?sslmode=disable"
      - "up"
    depends_on:
      postgres:
        condition: service_healthy
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  embedding:
    build:
      context: .
      dockerfile: deployments/docker/embedding-server.Dockerfile
    expose:
      - "9000"
    volumes:
      - hf-cache:/cache/hf
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      embedding:
        condition: service_started
    env_file:
      - .env
    environment:
      SERVER_PORT: "8080"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: vara
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: vara
      POSTGRES_SSLMODE: disable
      REDIS_ADDR: redis:6379
      EMBEDDING_SERVER_URL: http://embedding:9000/embed
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-haiku-4-5-20251001}
      GRC_CHECK_TIMEOUT_MIN: ${GRC_CHECK_TIMEOUT_MIN:-60}
      RBAC_CHAIN_INCLUDE_EKS: ${RBAC_CHAIN_INCLUDE_EKS:-true}  # EKS aws-auth 룰(R-INDIRECT-16) 활성
    ports:
      - "8080:8080"
    volumes:
      - trivy-cache:/var/cache/trivy
  aws-reader:
    build: ./aws-reader
    depends_on:
      backend:
        condition: service_started
    environment:
      - BACKEND_URL=http://backend:8080
      - AWS_REGION=ap-northeast-2
      - INTERVAL_MINUTES=5
    restart: unless-stopped
volumes:
  vara-pg-data:
  hf-cache:
  trivy-cache: