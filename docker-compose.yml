services:
  postgres:
    # pgvector 확장이 필요한 002_pgvector.up.sql 때문에 pgvector 동봉 이미지 사용
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vara
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: vara
    ports:
      - "5432:5432"
    volumes:
      - vara-pg-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vara -d vara"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  embedding:
    # BGE-M3 FastAPI. 첫 부팅 시 모델 가중치 ~2.3GB 다운로드 후 캐시.
    build:
      context: .
      dockerfile: deployments/docker/embedding-server.Dockerfile
    expose:
      - "9000"
    volumes:
      - hf-cache:/cache/hf
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      embedding:
        condition: service_started
    env_file:
      - .env
    environment:
      SERVER_PORT: "8080"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: vara
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: vara
      POSTGRES_SSLMODE: disable
      REDIS_ADDR: redis:6379
      EMBEDDING_SERVER_URL: http://embedding:9000/embed
      VLM_SERVER_URL: ${VLM_SERVER_URL:-}
    ports:
      - "8080:8080"
    volumes:
      - trivy-cache:/var/cache/trivy
volumes:
  vara-pg-data:
  hf-cache:
  trivy-cache:
